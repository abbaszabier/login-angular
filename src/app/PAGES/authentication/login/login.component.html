<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-gray-700 mb-2" for="phone">Phone</label>
        <input
          formControlName="phone"
          id="phone"
          [attr.disabled]="loading() ? true : null"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
          placeholder="Enter your phone"
        />
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 mb-2" for="password">Password</label>
        <input
          formControlName="password"
          id="password"
          type="password"
          [attr.disabled]="loading() ? true : null"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
          placeholder="Enter your password"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 cursor-pointer"
      >
        @if (loading()) {
          <span>Loading...</span>
        } @else {
          <span>Login</span>
        }
      </button>
      @if (errorMessage()) {
        <div class="mt-2 text-red-600 text-sm text-center">{{ errorMessage() }}</div>
      }
    </form>
  </div>
</div>
